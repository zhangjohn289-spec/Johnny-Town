name: Johnny Town Pages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish publicly (only after explicit owner approval)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
        working-directory: prototype
      - run: node --test test-core.mjs test-world.mjs test-woods.mjs
        working-directory: prototype
      - run: npm run build
        working-directory: prototype
      - run: node --test prototype/test-expansion.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: prototype/dist
  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
